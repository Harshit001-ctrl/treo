services:
  - type: web
    name: prepkit-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false 
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false 
      - key: GEMINI_API_KEY
        sync: false 
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
