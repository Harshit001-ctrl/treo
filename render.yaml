services:
  - type: web
    name: prepkit-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false # set manually in the Render dashboard — your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for you
      - key: FRONTEND_ORIGIN
        sync: false # set manually — your deployed Vercel URL, e.g. https://your-app.vercel.app (no trailing slash)
      - key: GEMINI_API_KEY
        sync: false # set manually — from https://aistudio.google.com/apikey
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
